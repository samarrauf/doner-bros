<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0b">
  <title>Kitchen Board</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* The customer site's theme on a dark board: ink background, charcoal cards, the menu's orange
       accent, Karla and Playfair Display. Each status has its own colour; red is kept for overdue. */
    :root {
      --bg: #0b0b0b;               /* site --ink */
      --panel: #16191b;
      --card: #24282b;             /* site --charcoal */
      --card-2: #31363a;           /* site --charcoal-soft */
      --line: #3a4045;
      --text: #f5f4f1;
      --text-2: #c7cbcf;
      --accent: #f5a623;           /* site --accent */
      --accent-ink: #141005;
      --new: #f5a623;              /* bright accent */
      --prep: #ffcd6b;             /* warm amber */
      --ready: #43c486;            /* green */
      --status-ink: #12110c;
      --warn: #ffb547;             /* waiting a while */
      --late: #ff5d55;             /* overdue: the only red highlight on a card */
      --late-bg: #3a1d1c;
      --cancel: #ef9a94;           /* muted red outline */
      --delivery: #7c3aed;
      --pickup: #474e54;
      --link: #ffd08a;
      --gap: clamp(6px, 0.8vw, 12px);
      --font-body: "Karla", "Noto Naskh Arabic", "Noto Nastaliq Urdu", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-display: "Playfair Display", "Noto Naskh Arabic", "Noto Nastaliq Urdu", Georgia, "Times New Roman", serif;
      /* Type scale: readable across the room on a laptop, never below 16px for body text. */
      --t-num: clamp(1.25rem, 0.95rem + 0.9vw, 1.75rem);
      --t-item: clamp(1rem, 0.88rem + 0.4vw, 1.25rem);
      --t-body: 1rem;
      --t-timer: clamp(1.125rem, 0.95rem + 0.6vw, 1.5rem);
      --t-head: clamp(1rem, 0.85rem + 0.5vw, 1.375rem);
      --tap: 48px;
      color-scheme: dark;
      font-family: var(--font-body);
      -webkit-text-size-adjust: 100%;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
      background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* ---------- Top bar and banners: their natural height ---------- */
    .bar {
      flex: none; display: flex; align-items: center; gap: 12px; background: #000; border-bottom: 1px solid var(--line);
      padding: max(6px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 6px max(14px, env(safe-area-inset-left));
    }
    .bar h1 { margin: 0; font: 700 clamp(1.25rem, 1rem + 0.8vw, 1.625rem)/1.1 var(--font-display); letter-spacing: -0.01em; }
    .bar h1 span { color: var(--accent); }
    .status { font-size: 0.9375rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--card); color: var(--text-2); white-space: nowrap; }
    .status.live::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--ready); vertical-align: 1px; }
    .status.bad { background: var(--late); color: #fff; }
    .clock { margin-left: auto; font-size: clamp(1.125rem, 0.9rem + 0.6vw, 1.5rem); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bar-btn {
      min-height: 44px; padding: 0 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--card);
      color: var(--text); font-size: 1rem; font-weight: 700; white-space: nowrap;
    }
    .bar-btn.on { border-color: var(--ready); }
    .bar-btn.off { color: var(--text-2); }
    .bar-btn.blocked { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }

    .notice { flex: none; padding: 8px 14px; font-size: 1rem; font-weight: 700; text-align: center; }
    .notice.warn { background: var(--accent); color: var(--accent-ink); }
    .notice .short { display: none; }
    .notice.err { background: var(--late); color: #fff; }
    .notice button { margin-left: 12px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 2px solid currentColor; background: transparent; font-weight: 800; }

    /* ---------- Board: fills the height that is left; only each column's list scrolls ---------- */
    .board {
      flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap);
      padding: var(--gap) max(var(--gap), env(safe-area-inset-right)) max(var(--gap), env(safe-area-inset-bottom)) max(var(--gap), env(safe-area-inset-left));
    }
    .col { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .col-head {
      flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 14px;
      color: var(--status-ink); font-size: var(--t-head); font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
    }
    .col-head .n { min-width: 2.2em; text-align: center; background: var(--status-ink); color: var(--text); border-radius: 999px; padding: 1px 10px; }
    .col[data-status="NEW"] .col-head { background: var(--new); }
    .col[data-status="PREPARING"] .col-head { background: var(--prep); }
    .col[data-status="READY"] .col-head { background: var(--ready); }
    .cards { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: var(--gap); display: flex; flex-direction: column; gap: var(--gap); }
    .empty-col { margin: 24px 8px; text-align: center; font-size: 1.0625rem; font-weight: 600; color: var(--text-2); }

    /* ---------- Card: everything visible without scrolling the card ---------- */
    .card {
      flex: none; container-type: inline-size; position: relative; display: flex; flex-direction: column; gap: 8px;
      padding: 10px 12px 12px 16px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; overflow-wrap: anywhere;
    }
    /* Status stripe down the left edge. */
    .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; border-radius: 10px 0 0 10px; background: var(--stripe, var(--line)); }
    .col[data-status="NEW"] .card { --stripe: var(--new); }
    .col[data-status="PREPARING"] .card { --stripe: var(--prep); }
    .col[data-status="READY"] .card { --stripe: var(--ready); }
    .card.amber { border-color: var(--warn); }
    .card.amber .timer { color: var(--warn); }
    .card.red { border-color: var(--late); background: var(--late-bg); --stripe: var(--late); }
    .card.red .timer { color: var(--late); }

    .card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .num { font-size: var(--t-num); font-weight: 800; line-height: 1; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
    .badge { font-size: 0.8125rem; font-weight: 800; padding: 3px 8px; border-radius: 6px; color: #fff; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    .badge.delivery { background: var(--delivery); }
    .badge.pickup { background: var(--pickup); }
    .timer { margin-left: auto; font-size: var(--t-timer); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
    .timer small { font-size: 0.75rem; font-weight: 600; color: var(--text-2); margin-right: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .meta { font-size: var(--t-body); font-weight: 700; color: var(--accent); }

    .items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
    .items li { font-size: var(--t-item); font-weight: 700; line-height: 1.25; }
    .items .qty { display: inline-block; min-width: 2.1em; font-weight: 800; color: var(--accent); }
    .opts { font-size: 0.9375rem; font-weight: 500; color: var(--text-2); padding-left: 2.25em; line-height: 1.3; }
    .more {
      align-self: flex-start; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px dashed var(--line);
      background: transparent; color: var(--link); font-size: var(--t-body); font-weight: 700;
    }
    .note { font-size: var(--t-body); font-weight: 700; background: #3b3220; color: #ffe2a8; border-left: 4px solid var(--accent); border-radius: 6px; padding: 6px 10px; }
    .note b { text-transform: uppercase; }

    .who { display: flex; flex-wrap: wrap; align-items: center; gap: 0 12px; font-size: var(--t-body); font-weight: 600; color: var(--text-2); }
    .who .name { color: var(--text); font-weight: 700; }
    .tel { display: inline-flex; align-items: center; min-height: 44px; font-weight: 800; color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
    .addr { flex-basis: 100%; color: var(--text); font-weight: 600; line-height: 1.35; }

    /* Main status button and Cancel side by side; Back is a small icon button before them. */
    .actions { display: flex; gap: 6px; align-items: stretch; }
    .go {
      flex: 1 1 auto; min-width: 0; min-height: var(--tap); padding: 0 10px; border: 0; border-radius: 10px;
      font-size: clamp(1rem, 0.9rem + 0.3vw, 1.1875rem); font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--status-ink);
    }
    .col[data-status="NEW"] .go { background: var(--new); }
    .col[data-status="PREPARING"] .go { background: var(--ready); }
    .col[data-status="READY"] .go { background: var(--text); }
    .back, .cancel {
      flex: none; min-height: var(--tap); min-width: 44px; padding: 0 10px; border-radius: 10px; background: transparent;
      font-size: var(--t-body); font-weight: 700; white-space: nowrap;
    }
    .back { border: 2px solid var(--line); color: var(--text); }
    .cancel { border: 2px solid var(--cancel); color: var(--cancel); }
    .go:active, .back:active, .cancel:active { transform: scale(0.98); }
    .go[disabled], .back[disabled], .cancel[disabled] { opacity: 0.5; }
    /* Narrow cards: Cancel shows its icon only (its label stays for screen readers). */
    @container (max-width: 270px) {
      .cancel .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .go { letter-spacing: 0.02em; }
    }

    /* A new order flashes for a few seconds so it's seen across the room. */
    @keyframes flash {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 166, 35, 0); }
      50% { box-shadow: 0 0 0 6px rgba(245, 166, 35, 0.95); background: #3a3020; }
    }
    .card.flash { animation: flash 0.75s ease-in-out 8; border-color: var(--accent); }
    @media (prefers-reduced-motion: reduce) { .card.flash { animation: none; outline: 6px solid var(--accent); } }

    /* ---------- Dialogs ---------- */
    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    .modal[hidden] { display: none; }
    .dialog { background: var(--card); color: var(--text); border-radius: 16px; padding: 22px; width: min(540px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 16px; border: 2px solid var(--line); }
    .dialog p { margin: 0; font-size: 1.375rem; font-weight: 800; line-height: 1.3; }
    .dialog > p:first-child { font-family: var(--font-display); font-weight: 700; }
    .dialog .row { display: flex; gap: 10px; }
    .dialog .row button { flex: 1; min-height: 56px; border-radius: 12px; font-size: 1.125rem; font-weight: 800; border: 2px solid var(--line); }
    .dialog .yes { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .dialog .yes.danger { background: #d93a3a; border-color: #d93a3a; color: #fff; }
    .dialog .no { background: transparent; color: var(--text); }
    .dialog .wa { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 12px; background: #128c4a; color: #fff;
                  font-size: 1.125rem; font-weight: 800; text-decoration: none; text-align: center; }
    .dialog .wa[hidden] { display: none; }
    .dialog .preview { font-size: 1rem; font-weight: 500; line-height: 1.45; background: var(--card-2); border-radius: 10px; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .dialog .sub { font-size: 1rem; font-weight: 600; color: var(--text-2); }

    /* Column tabs: phones only. */
    .tabs { display: none; }

    /* ---------- Tablets (768-1100px): three narrow columns ---------- */
    @media (max-width: 1100px) {
      .bar { gap: 8px; }
      .col-head { padding: 6px 10px; letter-spacing: 0.04em; }
      .card { padding: 8px 10px 10px 14px; gap: 6px; }
    }

    /* ---------- Phones (under 768px): one column at a time, picked with the tabs ---------- */
    @media (max-width: 767.98px) {
      .clock, .bar h1 span, .notice .long { display: none; }
      .notice .short { display: inline; }
      .notice { padding: 6px 10px; }
      .status { margin-left: auto; }
      .bar-btn { padding: 0 10px; }

      .tabs { flex: none; display: flex; gap: 6px; padding: 8px max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left)); }
      .tab {
        flex: 1; min-width: 0; min-height: 48px; padding: 4px; border: 2px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text);
        display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 6px; font-size: 1rem; font-weight: 800;
      }
      .tab .tn { min-width: 26px; padding: 0 6px; border-radius: 999px; background: var(--card-2); color: var(--text); line-height: 24px; text-align: center; }
      .tab[aria-selected="true"] { color: var(--status-ink); }
      .tab[aria-selected="true"] .tn { background: var(--status-ink); color: var(--text); }
      .tab[aria-selected="true"][data-status="NEW"] { background: var(--new); border-color: var(--new); }
      .tab[aria-selected="true"][data-status="PREPARING"] { background: var(--prep); border-color: var(--prep); }
      .tab[aria-selected="true"][data-status="READY"] { background: var(--ready); border-color: var(--ready); }

      .board { grid-template-columns: minmax(0, 1fr); padding-top: 8px; }
      .board .col { display: none; background: transparent; border: 0; border-radius: 0; }
      .board[data-tab="NEW"] .col[data-status="NEW"],
      .board[data-tab="PREPARING"] .col[data-status="PREPARING"],
      .board[data-tab="READY"] .col[data-status="READY"] { display: flex; }
      .col-head { display: none; }
      .cards { padding: 0 0 12px; }
      .card { padding: 8px 12px 10px 16px; gap: 6px; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <h1>Kitchen <span>Board</span></h1>
    <span class="status" id="status" role="status" aria-live="polite">Loading…</span>
    <span class="clock" id="clock" aria-hidden="true"></span>
    <button class="bar-btn" id="mute" type="button" aria-pressed="true">🔔 Sound on</button>
  </header>
  <div class="notice warn" id="sound-notice" hidden>🔇 <span class="long">Sound is blocked by the browser. Tap anywhere to turn on the new-order ringtone.</span><span class="short">Sound blocked: tap anywhere to allow it.</span></div>
  <div class="notice warn" id="threshold-notice" hidden>Card colours are off: set kitchen_amber_minutes and kitchen_red_minutes in settings.</div>
  <div class="notice err" id="error" role="alert" hidden></div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Order columns">
    <button class="tab" type="button" role="tab" data-status="NEW" aria-selected="true">New <span class="tn" id="t-NEW">0</span></button>
    <button class="tab" type="button" role="tab" data-status="PREPARING" aria-selected="false">Preparing <span class="tn" id="t-PREPARING">0</span></button>
    <button class="tab" type="button" role="tab" data-status="READY" aria-selected="false">Ready <span class="tn" id="t-READY">0</span></button>
  </nav>

  <main class="board" id="board" data-tab="NEW">
    <section class="col" data-status="NEW" aria-labelledby="h-new">
      <div class="col-head"><span id="h-new">New</span><span class="n" id="n-NEW">0</span></div>
      <div class="cards" id="c-NEW"></div>
    </section>
    <section class="col" data-status="PREPARING" aria-labelledby="h-prep">
      <div class="col-head"><span id="h-prep">Preparing</span><span class="n" id="n-PREPARING">0</span></div>
      <div class="cards" id="c-PREPARING"></div>
    </section>
    <section class="col" data-status="READY" aria-labelledby="h-ready">
      <div class="col-head"><span id="h-ready">Ready</span><span class="n" id="n-READY">0</span></div>
      <div class="cards" id="c-READY"></div>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="modal-text">
      <p id="modal-text"></p>
      <div class="row">
        <button class="no" id="modal-no" type="button">No, keep it</button>
        <button class="yes" id="modal-yes" type="button">Yes</button>
      </div>
    </div>
  </div>

  <!-- After a delivery order is completed: open WhatsApp with the "on the way" message ready to send. -->
  <div class="modal" id="wa-modal" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="wa-title">
      <p id="wa-title"></p>
      <p class="sub" id="wa-sub"></p>
      <p class="preview" id="wa-text" dir="auto"></p>
      <div class="row">
        <button class="no" id="wa-skip" type="button">Skip</button>
        <a class="wa" id="wa-send" href="#" target="_blank" rel="noopener noreferrer">💬 Send WhatsApp</a>
      </div>
    </div>
  </div>

  <script src="/admin/kitchen-alerts.js"></script>
  <script>
  (() => {
    "use strict";
    const POLL_MS = 10000;
    const TZ = "Asia/Karachi";
    const STATUSES = ["NEW", "PREPARING", "READY"];
    const FORWARD = { NEW: ["PREPARING", "Start"], PREPARING: ["READY", "Ready"], READY: ["COMPLETED", "Complete"] };
    const BACK = { PREPARING: ["NEW", "New"], READY: ["PREPARING", "Preparing"] };
    const ITEMS_SHOWN = 3;      // a card with more lines than ITEMS_SHOWN + 1 shows "+N more"
    const { CONFIG, createNewOrderDetector, reminderDue } = window.KitchenAlerts;
    // The sound choice lasts for this browser session only.
    const MUTE_KEY = "kitchen.muted";

    const $ = (id) => document.getElementById(id);
    // Every value is added as text, never as HTML, so nothing a customer typed can run as markup.
    function h(tag, attrs, ...children) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v === null || v === undefined || v === false) continue;
        if (k === "class") el.className = v;
        else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? "" : v);
      }
      for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : String(c));
      return el;
    }
    const session = {
      get(key) { try { return sessionStorage.getItem(key); } catch { return null; } },
      set(key, value) { try { sessionStorage.setItem(key, value); } catch { /* private mode: not remembered */ } },
    };

    const state = {
      orders: [],
      thresholds: null,
      deliveryEta: null,
      clockOffsetMs: 0,      // server time minus this tablet's time, so timers don't drift with a wrong clock
      lastOk: 0,
      busy: new Set(),       // order ids with a request in flight
      expanded: new Set(),   // order ids whose full item list is open
      flashUntil: new Map(), // order id -> time its flash ends
      cards: new Map(),      // order id -> { el, sig, order }
      detector: createNewOrderDetector(),
      lastPingAt: null,
      muted: session.get(MUTE_KEY) === "1",
    };

    const now = () => Date.now() + state.clockOffsetMs;
    const mmss = (ms) => {
      const s = Math.max(0, Math.floor(ms / 1000));
      const m = Math.floor(s / 60);
      return m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m` : `${m}:${String(s % 60).padStart(2, "0")}`;
    };
    const clockFmt = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "numeric", minute: "2-digit", hour12: true });
    // The customer is given e.g. DB-20261030-K7M2QX; its last six characters are what they'll say.
    const shortId = (id) => id.slice(-6);

    /* ---------- Sound ---------- */
    // Browsers block audio until someone taps the page; the banner says so until then.
    let audio = null;
    let blockedAtTap = false;
    const audioRunning = () => !!audio && audio.state === "running";
    function unlockAudio() {
      try {
        if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
        if (audio.state === "suspended") audio.resume().then(renderMute, renderMute);
      } catch { audio = null; }
      renderMute();
    }
    // One bell strike: a sine at the note plus a quieter, faster-fading overtone, so it rings, not beeps.
    function strike(freq, at, length, volume) {
      const t = audio.currentTime + at;
      for (const [mult, level, decay] of [[1, 1, length], [2.76, 0.28, length * 0.45]]) {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = "sine";
        osc.frequency.value = freq * mult;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(volume * level, t + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + decay);
        osc.connect(gain).connect(audio.destination);
        osc.start(t);
        osc.stop(t + decay + 0.05);
      }
    }
    const canPlay = () => !state.muted && audioRunning();
    // New order: a two-tone ring (high, low) repeated for about CONFIG.RING_MS.
    function ring() {
      if (!canPlay()) return;
      const cycle = 0.75;
      const cycles = Math.max(1, Math.round(CONFIG.RING_MS / 1000 / cycle));
      for (let i = 0; i < cycles; i++) {
        strike(1318.5, i * cycle, 0.6, 0.55);       // E6
        strike(987.8, i * cycle + 0.3, 0.6, 0.55);  // B5
      }
    }
    // Reminder: one short, softer ping of about CONFIG.PING_MS.
    function ping() {
      if (!canPlay()) return;
      strike(1568, 0, CONFIG.PING_MS / 1000, 0.4);  // G6
    }
    function renderMute() {
      const btn = $("mute");
      const blocked = !state.muted && !audioRunning();
      btn.setAttribute("aria-pressed", String(!state.muted));
      btn.className = `bar-btn ${state.muted ? "off" : blocked ? "blocked" : "on"}`;
      btn.textContent = state.muted ? "🔕 Sound off" : blocked ? "🔇 Tap to allow sound" : "🔔 Sound on";
      $("sound-notice").hidden = !blocked;
    }
    // The first tap on a blocked page only allows sound; it never also switches it off.
    document.addEventListener("pointerdown", () => { blockedAtTap = !audioRunning(); unlockAudio(); }, { capture: true, passive: true });
    document.addEventListener("keydown", unlockAudio, { capture: true });
    $("mute").addEventListener("click", () => {
      if (blockedAtTap && !state.muted) { blockedAtTap = false; unlockAudio(); return; }
      state.muted = !state.muted;
      session.set(MUTE_KEY, state.muted ? "1" : "0");
      unlockAudio();
      renderMute();
      if (!state.muted) ping(); // so staff hear that it works
    });

    /* ---------- Keep the screen awake where the device allows it ---------- */
    let wakeLock = null;
    async function keepAwake() {
      if (!("wakeLock" in navigator) || document.visibilityState !== "visible" || wakeLock) return;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      } catch { /* not allowed (e.g. battery saver): the board still works */ }
    }

    /* ---------- API ---------- */
    class ApiError extends Error {}
    async function api(path, body) {
      const res = await fetch(new URL(path, location.origin), {
        method: body ? "POST" : "GET",
        cache: "no-store",
        credentials: "same-origin",
        headers: body ? { "Content-Type": "application/json" } : undefined,
        body: body ? JSON.stringify(body) : undefined,
      });
      if (res.status === 401) throw new ApiError("Signed out. Reload the page to sign in again.");
      let data = null;
      try { data = await res.json(); } catch { /* not JSON */ }
      if (!res.ok) throw Object.assign(new ApiError((data && data.error) || "Couldn't reach the server."), { status: res.status });
      return data;
    }

    function showError(message, retry) {
      const el = $("error");
      if (!message) { el.hidden = true; el.replaceChildren(); return; }
      el.replaceChildren(message, retry ? h("button", { type: "button", onclick: retry }, "Try again") : null);
      el.hidden = false;
    }

    /* ---------- Board ---------- */
    let polling = null;
    let loading = false;
    async function load() {
      if (loading) return;
      loading = true;
      try {
        const data = await api("/api/admin/orders/live");
        state.clockOffsetMs = Date.parse(data.serverNow) - Date.now();
        state.thresholds = data.thresholds;
        state.deliveryEta = data.deliveryEta || null;
        state.orders = data.orders;
        state.lastOk = Date.now();
        noticeNew(data.orders);
        showError(null);
        render();
      } catch (error) {
        showError(error.message, error.message.startsWith("Signed out") ? null : load);
      } finally {
        loading = false;
        renderStatus();
      }
    }

    // Orders that weren't on the board before flash and ring once. The first load only learns
    // what is already there; a status change is never a new order.
    function noticeNew(orders) {
      const fresh = state.detector.check(orders);
      if (!fresh.length) return;
      const until = Date.now() + CONFIG.FLASH_MS;
      for (const id of fresh) state.flashUntil.set(id, until);
      ring();
    }

    function startPolling() {
      clearInterval(polling);
      polling = setInterval(load, POLL_MS);
    }

    function lineItem(line) {
      const extra = [...line.options, ...line.contains];
      return h("li", null,
        h("span", { class: "qty" }, `${line.quantity === null ? "?" : line.quantity} ×`), line.name,
        extra.length ? h("div", { class: "opts" }, extra.join(" · ")) : null);
    }

    function itemList(order) {
      const id = order.orderId;
      const all = order.items;
      const collapsible = all.length > ITEMS_SHOWN + 1;
      const open = state.expanded.has(id);
      const shown = collapsible && !open ? all.slice(0, ITEMS_SHOWN) : all;
      const toggle = () => { if (open) state.expanded.delete(id); else state.expanded.add(id); render(); };
      return [
        h("ul", { class: "items" }, shown.map(lineItem)),
        collapsible ? h("button", { class: "more", type: "button", "aria-expanded": String(open), onclick: toggle },
          open ? "Show less" : `+${all.length - ITEMS_SHOWN} more`) : null,
      ];
    }

    function buildCard(order) {
      const id = order.orderId;
      const busy = state.busy.has(id);
      const [forwardTo, forwardLabel] = FORWARD[order.status];
      const back = BACK[order.status];
      const pickupWhen = order.orderType === "pickup" ? (order.pickupTime ? `Pickup at ${order.pickupTime}` : "Pickup ASAP") : null;
      const telHref = order.customerPhone ? `tel:${order.customerPhone.replace(/[^\d+]/g, "")}` : null;
      const who = order.customerName || order.customerPhone || order.address
        ? h("div", { class: "who" },
          order.customerName ? h("span", { class: "name" }, order.customerName) : null,
          telHref ? h("a", { class: "tel", href: telHref, "aria-label": `Call ${order.customerPhone}` }, `📞 ${order.customerPhone}`) : null,
          order.address ? h("span", { class: "addr" }, `📍 ${order.address}`) : null)
        : null;
      return h("article", { class: "card", "data-id": id, "aria-label": `Order ${shortId(id)}` },
        h("div", { class: "card-top" },
          h("span", { class: "num" }, `#${shortId(id)}`),
          h("span", { class: `badge ${order.orderType}` }, order.orderType === "delivery" ? (order.deliveryFeeTbc ? "🛵 Delivery · fee TBC" : "🛵 Delivery") : "🛍 Pickup"),
          h("span", { class: "timer", title: "Waiting since the order came in" }, h("small", null, "wait"), h("span", { "data-timer": "" }, ""))),
        pickupWhen ? h("div", { class: "meta" }, pickupWhen) : null,
        itemList(order),
        order.note ? h("div", { class: "note" }, h("b", null, "Note: "), order.note) : null,
        who,
        h("div", { class: "actions" },
          back ? h("button", { class: "back", type: "button", disabled: busy, "aria-label": `Move back to ${back[1]}`, title: `Back to ${back[1]}`,
            onclick: () => confirmMove(order, back[0], `Move order #${shortId(id)} back to ${back[1]}?`, false) }, "◀") : null,
          h("button", { class: "go", type: "button", disabled: busy, onclick: () => move(order, forwardTo) }, `${forwardLabel} ▶`),
          h("button", { class: "cancel", type: "button", disabled: busy, "aria-label": "Cancel order",
            onclick: () => confirmMove(order, "CANCELLED", `Cancel order #${shortId(id)}? It will leave the board and won't count as a sale.`, true) },
            "✕", h("span", { class: "label" }, " Cancel"))));
    }

    function render() {
      const live = new Set(state.orders.map((o) => o.orderId));
      for (const id of state.cards.keys()) if (!live.has(id)) state.cards.delete(id);
      for (const id of state.flashUntil.keys()) if (!live.has(id)) state.flashUntil.delete(id);
      for (const id of state.expanded) if (!live.has(id)) state.expanded.delete(id);

      for (const status of STATUSES) {
        const list = state.orders.filter((o) => o.status === status);
        const wanted = list.map((order) => {
          // A card is rebuilt only when what it shows changes, so a running flash isn't restarted.
          const sig = JSON.stringify([order, state.busy.has(order.orderId), state.expanded.has(order.orderId)]);
          let entry = state.cards.get(order.orderId);
          if (!entry || entry.sig !== sig) {
            const el = buildCard(order);
            if (entry && entry.el.classList.contains("flash")) el.classList.add("flash");
            entry = { el, sig, order };
            state.cards.set(order.orderId, entry);
          }
          return entry.el;
        });
        const box = $(`c-${status}`);
        const current = [...box.children];
        const same = current.length === wanted.length && current.every((el, i) => el === wanted[i]);
        if (!same) box.replaceChildren(...(wanted.length ? wanted : [h("div", { class: "empty-col" }, "No orders")]));
        $(`n-${status}`).textContent = String(list.length);
        $(`t-${status}`).textContent = String(list.length);
      }
      tick();
    }

    // Every second: timers, colours, the clock, flashes and the reminder ping. Nothing is rebuilt here.
    function tick() {
      const t = now();
      const th = state.thresholds;
      for (const { el, order } of state.cards.values()) {
        el.querySelector("[data-timer]").textContent = mmss(t - Date.parse(order.createdAt));
        const inColumnMin = (t - Date.parse(order.statusChangedAt)) / 60000;
        el.classList.toggle("red", !!th && inColumnMin >= th.redMinutes);
        el.classList.toggle("amber", !!th && inColumnMin >= th.amberMinutes && inColumnMin < th.redMinutes);
        const flashing = (state.flashUntil.get(order.orderId) || 0) > Date.now();
        if (flashing && !el.classList.contains("flash")) el.classList.add("flash");
        if (!flashing && el.classList.contains("flash")) el.classList.remove("flash");
      }
      if (state.lastOk && reminderDue(state.orders, t, state.lastPingAt)) {
        state.lastPingAt = t;
        ping();
      }
      $("threshold-notice").hidden = !!th || state.lastOk === 0;
      $("clock").textContent = clockFmt.format(new Date(t));
      renderStatus();
    }

    function renderStatus() {
      const el = $("status");
      if (!state.lastOk) { el.textContent = "Loading…"; el.className = "status"; return; }
      const age = Math.floor((Date.now() - state.lastOk) / 1000);
      const stale = age > POLL_MS / 1000 * 3;
      el.className = `status ${stale ? "bad" : "live"}`;
      el.textContent = stale ? `Not updated for ${mmss(age * 1000)}` : "Live";
    }

    /* ---------- Moving orders ---------- */
    async function move(order, to) {
      const id = order.orderId;
      if (state.busy.has(id)) return;
      state.busy.add(id);
      render();
      try {
        await api(`/api/admin/orders/${encodeURIComponent(id)}/status`, { from: order.status, to });
        showError(null);
        if (to === "COMPLETED" && order.orderType === "delivery") offerOnTheWay(order);
      } catch (error) {
        // 409: another tablet changed it first; the reload below shows where it is now.
        showError(error.message);
      } finally {
        state.busy.delete(id);
        await load();
      }
    }

    let pending = null;
    function confirmMove(order, to, text, danger) {
      pending = { order, to };
      $("modal-text").textContent = text;
      const yes = $("modal-yes");
      yes.textContent = danger ? "Yes, cancel it" : "Yes, move back";
      yes.classList.toggle("danger", danger);
      $("modal").hidden = false;
      $("modal-no").focus();
    }
    function closeModal() { $("modal").hidden = true; pending = null; }
    $("modal-no").addEventListener("click", closeModal);
    $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });
    $("modal-yes").addEventListener("click", () => {
      const p = pending;
      closeModal();
      if (p) move(p.order, p.to);
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("modal").hidden) closeModal(); });

    /* ---------- "On the way" WhatsApp message ---------- */
    // Pakistani mobile numbers as WhatsApp wants them: 92 followed by 10 digits. Anything else: null.
    function waNumber(phone) {
      let d = String(phone || "").replace(/\D/g, "");
      if (d.startsWith("0092")) d = d.slice(2);
      if (/^03\d{9}$/.test(d)) d = "92" + d.slice(1);
      else if (/^3\d{9}$/.test(d)) d = "92" + d;
      return /^923\d{9}$/.test(d) ? d : null;
    }
    function onTheWayText(order) {
      const eta = state.deliveryEta;
      const hello = order.customerName ? `Assalam o Alaikum ${order.customerName}!` : "Assalam o Alaikum!";
      const when = eta ? ` and should reach you in ${eta.minMinutes}–${eta.maxMinutes} minutes` : "";
      return `${hello} Your Doner Bros order #${shortId(order.orderId)} is on the way${when}. Please keep your phone nearby for the rider's call. Thank you!`;
    }
    function offerOnTheWay(order) {
      const number = waNumber(order.customerPhone);
      const text = onTheWayText(order);
      $("wa-title").textContent = `Order #${shortId(order.orderId)} is out for delivery`;
      $("wa-sub").textContent = number
        ? "Send the customer this message?"
        : `This phone number can't be opened in WhatsApp${order.customerPhone ? ` (${order.customerPhone})` : ""}. Call or message them yourself.`;
      $("wa-text").textContent = text;
      const send = $("wa-send");
      send.hidden = !number;
      send.href = number ? `https://wa.me/${number}?text=${encodeURIComponent(text)}` : "#";
      $("wa-modal").hidden = false;
      (number ? send : $("wa-skip")).focus();
    }
    const closeWa = () => { $("wa-modal").hidden = true; };
    $("wa-skip").addEventListener("click", closeWa);
    $("wa-send").addEventListener("click", () => setTimeout(closeWa, 0));
    $("wa-modal").addEventListener("click", (e) => { if (e.target === $("wa-modal")) closeWa(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("wa-modal").hidden) closeWa(); });

    /* ---------- Phone tabs ---------- */
    $("tabs").addEventListener("click", (e) => {
      const tab = e.target.closest(".tab");
      if (!tab) return;
      $("board").dataset.tab = tab.dataset.status;
      for (const t of $("tabs").children) t.setAttribute("aria-selected", String(t === tab));
      $(`c-${tab.dataset.status}`).scrollTop = 0;
    });

    /* ---------- Sleep and wake ---------- */
    // A sleeping device stops timers and network. On waking, reload at once, restart the poll and take
    // the wake lock again; orders that came in while asleep are still new here, so they flash and ring.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") { load(); startPolling(); keepAwake(); }
    });
    window.addEventListener("online", load);
    window.addEventListener("pageshow", (e) => { if (e.persisted) { load(); startPolling(); keepAwake(); } });

    renderMute();
    setInterval(tick, 1000);
    load();
    startPolling();
    keepAwake();
  })();
  </script>
</body>
</html>
